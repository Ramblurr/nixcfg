              - WEBDL-480p
              - WEBRip-480p
          - name: DVD
          - name: SDTV
        upgrade:
          allowed: false
          until_quality: WEB 480p
        reset_unmatched_scores:
          enabled: true
      - name: HD-1080p
        reset_unmatched_scores:
          enabled: true
      - name: WEB-1080p
