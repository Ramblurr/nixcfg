---
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: forbid-submodules

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --config flake/gitleaks.toml
        language: system
        pass_filenames: false
      - id: forbidden-strings
        name: forbidden-strings
        entry: nix run .#forbidden-strings -- --staged
        language: system
        pass_filenames: false
      - id: nix-lint
        name: nix lint (statix, deadnix, nixfmt, nix-comment-lint)
        entry: nix run .#lint
        language: system
        files: '\.nix$'
        pass_filenames: false
